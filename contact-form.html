<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: bold;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 0.7rem;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
        }

        .error {
            color: #b00020;
            margin-top: 0.3rem;
        }

        .success {
            color: #176b2c;
            margin-top: 1rem;
        }

        #api-result {
            margin-top: 2rem;
            padding: 1rem;
            background: #f2f2f2;
        }
    </style>
</head>

<body>
    <main>
        <h1>Contact Me</h1>

        <form id="contact-form" novalidate>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required aria-describedby="name-error">
                <div id="name-error" class="error"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required aria-describedby="email-error">
                <div id="email-error" class="error"></div>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required aria-describedby="subject-error">
                <div id="subject-error" class="error"></div>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required aria-describedby="message-error"></textarea>
                <div id="message-error" class="error"></div>
            </div>

            <button type="submit">Send Message</button>
            <div id="form-status" role="status" aria-live="polite"></div>
        </form>

        <section id="api-result" aria-live="polite">
            Loading a motivational quote...
        </section>
    </main>

    <script>
        const form = document.getElementById("contact-form");
        const statusMessage = document.getElementById("form-status");
        const fields = ["name", "email", "subject", "message"];

        function showError(field, message) {
            document.getElementById(`${field}-error`).textContent = message;
        }

        function clearError(field) {
            document.getElementById(`${field}-error`).textContent = "";
        }

        fields.forEach((field) => {
            document.getElementById(field).addEventListener("input", () => {
                clearError(field);
                statusMessage.textContent = "";
            });
        });

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            let isValid = true;

            fields.forEach((field) => {
                const input = document.getElementById(field);

                if (!input.value.trim()) {
                    showError(field, "This field is required.");
                    isValid = false;
                }
            });

            const email = document.getElementById("email");

            if (email.value.trim() && !email.value.includes("@")) {
                showError("email", "Please enter a valid email address.");
                isValid = false;
            }

            if (!isValid) {
                statusMessage.textContent = "Please correct the errors above.";
                statusMessage.className = "error";
                return;
            }

            statusMessage.textContent = "Your message has been submitted successfully.";
            statusMessage.className = "success";
            form.reset();
        });

        fetch("https://api.quotable.io/random")
            .then((response) => {
                if (!response.ok) {
                    throw new Error("Unable to load quote.");
                }
                return response.json();
            })
            .then((data) => {
                document.getElementById("api-result").textContent =
                    `"${data.content}" — ${data.author}`;
            })
            .catch(() => {
                document.getElementById("api-result").textContent =
                    "The quote could not be loaded right now.";
            });
    </script>
</body>

</html>
